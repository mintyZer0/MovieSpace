<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>minty's blog</title>
  </head>
  <body>
    <header>
      <div class="navbar">
        <h1>MovieSpace</h1>
        <div class="search-container">
          <i class="bi bi-search search-icon"></i>
          <input
            class="search-movies"
            type="text"
            placeholder="Search movie posts..."
          />
        </div>
        <nav>
          <a href="index.html">Home</a>
          <a href="browse.html">Browse</a>
          <a href="create-post.html">Create Post</a>
        </nav>
        <img class="account-image" src="images/pfpv2.png" alt="account-image" />
      </div>

      <hr />
    </header>

    <main class="container">
      <div class="post-form">
        <form>
          <div class="mb-3">
            <label for="post-title" class="form-label">Title</label>
            <input
              type="text"
              class="form-control"
              id="post-title"
              placeholder="This new spider-man movie is bonkers..."
            />
          </div>
          <div class="mb-3">
            <label for="blog-text" class="form-label">Body Text</label>
            <textarea
              class="form-control"
              placeholder="Write your blog here..."
              id="blog-text"
              rows="6"
            ></textarea>
          </div>
          <div class="file-upload mb-3 position-relative d-flex flex-column">
            <label for="formFileMultiple" class="form-label"
              >Attach 3 images</label
            >
            <i class="bi bi-upload"></i>
            <input class="" type="file" id="formFileMultiple" multiple />
          </div>
          <div class="form-submit">
            <button class="post-submit-btn btn btn-primary">Submit</button>
          </div>
        </form>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
