<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Browse Movies - MovieSpace</title>
  </head>
  <body>
    <header>
      <div class="navbar container-fluid">
        <h1>MovieSpace</h1>
        <div class="search-container">
          <i class="bi bi-search search-icon"></i>
          <input
            class="search-movies"
            type="text"
            placeholder="Search movie posts..."
          />
        </div>
        <nav>
          <a href="index.html">Home</a>
          <a href="browse.html">Browse</a>
          <a href="#">Post</a>
        </nav>
        <img
          class="account-image"
          src="/images/pfpv2.png"
          alt="account-image"
        />
      </div>
      <hr />
    </header>

    <main class="browse-container justify-content-center align-items-center">
      <div class="browse-header container">
        <h2 class="p-4">Search for movies</h2>
        <div class="browse-search-container">
          <i class="bi bi-search search-icon"></i>
          <input
            class="browse-search-movies"
            type="text"
            placeholder="Search for movies..."
          />
        </div>
      </div>

      <div class="movie-carousel">
        <div class="movie-carousel-card">
          <img src="/images/movie-carousel-1.png" alt="Horror" />
          <div class="movie-card-overlay">
            <h3>Horror</h3>
          </div>
        </div>
        <div class="movie-carousel-card">
          <img src="/images/movie-carousel-2.png" alt="Comedy" />
          <div class="movie-card-overlay">
            <h3>Comedy</h3>
          </div>
        </div>
        <div class="movie-carousel-card">
          <img src="/images/movie-carousel-3.png" alt="Action" />
          <div class="movie-card-overlay">
            <h3>Action</h3>
          </div>
        </div>
        <div class="movie-carousel-card">
          <img src="/images/movie-carousel-4.png" alt="Thriller" />
          <div class="movie-card-overlay">
            <h3>Thriller</h3>
          </div>
        </div>
        <div class="movie-carousel-card">
          <img src="/images/movie-carousel-5.jpg" alt="Sci-Fi" />
          <div class="movie-card-overlay">
            <h3>Sci-Fi</h3>
          </div>
        </div>
        <div class="movie-carousel-card">
          <img src="/images/movie-carousel-6.jpg" alt="Drama" />
          <div class="movie-card-overlay">
            <h3>Drama</h3>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
